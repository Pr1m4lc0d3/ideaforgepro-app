<!-- Heat-haze filter: fractal noise displaces whatever it's applied to, and the animated
     baseFrequency makes the distortion shimmer like hot air rising. Used on the molten footer seam. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="heat" x="-20%" y="-30%" width="140%" height="160%" color-interpolation-filters="sRGB">
    <!-- Broad, soft, low-frequency noise → a mirage, not tight bands. Two motions layered:
         a slow spline breath on baseFrequency (shimmer) and a gentle vertical drift on the noise
         (feOffset) so the distortion rises off the seam like hot air instead of pulsing in place. -->
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="2" seed="4" result="n0">
      <animate attributeName="baseFrequency" dur="6s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
               values="0.009 0.012;0.011 0.017;0.009 0.012"/>
    </feTurbulence>
    <feOffset in="n0" result="n" dy="0">
      <animate attributeName="dy" dur="3.2s" repeatCount="indefinite"
               calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
               values="10;-10;10"/>
    </feOffset>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
